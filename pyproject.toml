[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-pt"
version = "1.0.0"
description = "Local, read-only Cisco Packet Tracer analysis with three-engine consensus and AI question interpretation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TRIDENT contributors" }]
keywords = ["cisco", "packet-tracer", "pka", "pkt", "network-analysis", "consensus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "networkx>=3.2",
  "defusedxml>=0.7",
  # Engine B — external GPL-3.0 distribution, invoked via its public API/CLI
  "pkt-core>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
trident = "trident.__main__:main"

[tool.setuptools]
packages = [
  "trident",
  "trident.parsers",
  "trident.normalization",
  "trident.verification",
  "trident.reasoning",
  "trident.tools",
  "trident.requirements",
  "trident.compliance",
  "trident.remediation",
  "trident.knowledge",
  "trident.security",
  "trident.diff",
]

[tool.setuptools.package-data]
trident = ["web/*.html", "web/*.js", "web/*.css", "parsers/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests are opt-in: they start a real server and drive Chromium, which is
# far too slow for the default loop. Live simulator tests are opt-in too: they
# START Cisco Packet Tracer, which must never happen as a side effect of running
# the test suite on someone's desktop.
#
#   pytest                      -> nothing that opens Packet Tracer
#   pytest -m browser           -> browser tests only
#   pytest -m live_simulator    -> real simulator tests only
addopts = "-m 'not browser and not live_simulator'"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "live_simulator: needs a real Packet Tracer instance; skipped when unavailable",
  "browser: drives a real browser; requires playwright and is excluded by default",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI requires File(...)/Form(...) in argument defaults.
ignore = ["B008", "PERF102", "RUF059", "RUF015"]
